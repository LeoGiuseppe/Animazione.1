
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metroidvania Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <div class="lives-display" id="hearts-hud"></div>
    <span id="zone-name"></span>
    <div id="abilities-hud"></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="mobile-controls">
    <button id="btn-left">◀</button>
    <button id="btn-jump">▲ Jump</button>
    <button id="btn-attack">⚔ Attack</button>
    <button id="btn-right">▶</button>
  </div>

  <div id="instructions">WASD / Arrow keys to move &nbsp;|&nbsp; W / Space = Jump &nbsp;|&nbsp; E = Attack</div>
</div>

<div id="zone-banner"></div>

<!--
  Ordine di caricamento OBBLIGATORIO:
  1. config.js    — variabili globali (tileSize, ecc.)
  2. sprite.js    — array URL immagini
  3. map.js       — griglia, zone, getTileColor, isSolidTile
  4. items.js     — oggetti collezionabili, playerAbilities
  5. hud.js       — updateHeartsHUD, updateAbilitiesHUD, detectZone, showBanner
  6. controlli.js — keysPressed, jumpRequested, attackRequested, initControls
  7. player.js    — animatedObject, lastCheckpoint
  8. enemies.js   — createEnemy, enemies[]
  9. canva.js     — myGameArea
  10. game.js     — updateGameArea, startGame (avvia tutto al load)
-->
<script src="config.js"></script>
<script src="sprite.js"></script>
<script src="map.js"></script>
<script src="items.js"></script>
<script src="hud.js"></script>
<script src="controlli.js"></script>
<script src="player.js"></script>
<script src="enemies.js"></script>
<script src="canva.js"></script>
<script src="game.js"></script>

</body>
</html>
